<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unifi Site Monitor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img id="site-logo" class="site-logo" alt="" hidden />
        <div>
          <p class="eyebrow">Unifi Site Monitor</p>
          <h1>Sites</h1>
        </div>
      </div>
      <div class="header-side">
        <nav id="nav" class="header-links"></nav>
        <button type="button" data-logout>Log out</button>
        <div class="status" id="status">Waiting for the first check</div>
      </div>
    </header>

    <main id="main"></main>

    <dialog id="site-dialog">
      <div class="dialog-bar">
        <button type="button" id="close-site">Close</button>
      </div>
      <div id="site-body"></div>
    </dialog>
    <script src="/brand.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
