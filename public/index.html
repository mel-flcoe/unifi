<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UniFi warnings</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="eyebrow">UniFi Site Manager</p>
        <h1>Sites</h1>
      </div>
      <div class="header-side">
        <a class="settings-link" href="/settings">Settings</a>
        <div class="status" id="status">Waiting for the first check</div>
      </div>
    </header>

    <main id="main"></main>

    <dialog id="site-dialog">
      <div class="dialog-bar">
        <button type="button" id="close-site">Close</button>
      </div>
      <div id="site-body"></div>
    </dialog>
    <script src="/app.js"></script>
  </body>
</html>
