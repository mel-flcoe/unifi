<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Password · Unifi Site Monitor</title>
    <link rel="icon" href="/favicon" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img id="site-logo" class="site-logo" alt="" hidden />
        <div>
          <p class="eyebrow">Unifi Site Monitor</p>
          <h1>Password</h1>
        </div>
      </div>
      <div class="header-side">
        <nav class="menu" aria-label="Account">
          <a href="/">Sites</a>
          <button type="button" data-logout>Log out</button>
        </nav>
      </div>
    </header>
    <main>
      <form class="settings-form" id="password-form">
        <label for="current-password">Current password</label>
        <input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required />
        <label for="new-password">New password</label>
        <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="12" required />
        <p class="quiet">At least 12 characters.</p>
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" required />
        <button type="submit">Change password</button>
        <p id="password-message" class="quiet" role="status"></p>
      </form>
    </main>
    <script src="/brand.js"></script>
    <script type="module" src="/password.js"></script>
  </body>
</html>
